
services:

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-net

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-net

  # ─────────────────────────────────────────────
  # ChromaDB
  # ─────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    environment:
      CHROMA_SERVER_AUTHN_CREDENTIALS: ${CHROMA_TOKEN}
      CHROMA_SERVER_AUTHN_PROVIDER: chromadb.auth.token_authn.TokenAuthenticationServerProvider
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-net

  # ─────────────────────────────────────────────
  # Ollama — instance 1 (GPU 0)
  # ─────────────────────────────────────────────
  ollama-1:
    image: ollama/ollama:latest
    container_name: ollama-1
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - ollama_1_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - ai-net

  # ─────────────────────────────────────────────
  # Ollama — instance 2 (GPU 1)
  # ─────────────────────────────────────────────
  ollama-2:
    image: ollama/ollama:latest
    container_name: ollama-2
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
      CUDA_VISIBLE_DEVICES: "1"
    volumes:
      - ollama_2_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    networks:
      - ai-net

  # ─────────────────────────────────────────────
  # Open WebUI — instance 1
  # ─────────────────────────────────────────────
  open-webui-1:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: open-webui-1
    restart: unless-stopped
    ports:
      - "3001:8080"
    environment:
      # Ollama — load balance across both instances
      OLLAMA_BASE_URLS: "http://ollama-1:11434;http://ollama-2:11434"

      # PostgreSQL
      DATABASE_URL: postgresql://openwebui:${POSTGRES_PASSWORD}@postgres:5432/openwebui

      # Redis (enables stateless multi-instance mode)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # ChromaDB
      VECTOR_DB: chroma
      CHROMA_HTTP_HOST: chromadb
      CHROMA_HTTP_PORT: "8000"
      CHROMA_HTTP_HEADERS: '{"Authorization": "Bearer ${CHROMA_TOKEN}"}'
      CHROMA_TENANT: default_tenant
      CHROMA_DATABASE: default_database

      # GPU for local sentence-transformers (embedding + reranker)
      USE_CUDA_DOCKER: "true"
      DEVICE_TYPE: cuda

      # Auth
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "true"

      # Misc
      WEBUI_NAME: "Open WebUI"
      ENV: prod
    volumes:
      - open_webui_1_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama-1:
        condition: service_started
      ollama-2:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-net

  # ─────────────────────────────────────────────
  # Open WebUI — instance 2
  # ─────────────────────────────────────────────
  open-webui-2:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: open-webui-2
    restart: unless-stopped
    ports:
      - "3002:8080"
    environment:
      OLLAMA_BASE_URLS: "http://ollama-1:11434;http://ollama-2:11434"

      DATABASE_URL: postgresql://openwebui:${POSTGRES_PASSWORD}@postgres:5432/openwebui

      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      VECTOR_DB: chroma
      CHROMA_HTTP_HOST: chromadb
      CHROMA_HTTP_PORT: "8000"
      CHROMA_HTTP_HEADERS: '{"Authorization": "Bearer ${CHROMA_TOKEN}"}'
      CHROMA_TENANT: default_tenant
      CHROMA_DATABASE: default_database

      USE_CUDA_DOCKER: "true"
      DEVICE_TYPE: cuda

      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "true"

      WEBUI_NAME: "Open WebUI"
      ENV: prod
    volumes:
      - open_webui_2_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama-1:
        condition: service_started
      ollama-2:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-net

  # ─────────────────────────────────────────────
  # Nginx — load balancer across Open WebUI instances
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - open-webui-1
      - open-webui-2
    networks:
      - ai-net

# ─────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  ollama_1_data:
  ollama_2_data:
  open_webui_1_data:
  open_webui_2_data:

networks:
  ai-net:
    driver: bridge
